org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.code.style=official

# The version (docs/release.md#versions). A release build passes -Pversion=X.Y.Z from its tag.
version=1.0.0-dev

# The web version's production build optimises the whole program at once, which needs more memory.
org.gradle.jvmargs=-Xmx4g
kotlin.daemon.jvmargs=-Xmx4g
