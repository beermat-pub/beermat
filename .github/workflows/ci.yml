# Build and test on every push and pull request (docs/release.md).
# Linux only while the repository is private: GitHub bills macOS and Windows minutes at 10x and 2x.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build

  # The manual builds, so a broken page fails here rather than at a release (docs/manual.md).
  manual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: manual/package-lock.json }
      - run: cd manual && npm ci && npm run build
      # The VS Code extension's edits to the document (docs/vscode.md).
      - run: node --test vscode/test/edit.test.js
