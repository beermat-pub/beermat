[versions]
kotlin = "2.4.21"
compose = "1.12.2"
# The browser's document and window for Kotlin/Wasm (the web version), the version Compose uses.
kotlinx-browser = "0.5.0"
snakeyaml-engine = "2.9"
# The same, for Kotlin Multiplatform (the format module, which also runs in the browser).
snakeyaml-engine-kmp = "5.0.0"
# Tests only: reads back and renders the PDFs Beermat writes.
pdfbox = "3.0.3"
# Reading Excel workbooks inside .xmcd components (classic .xls, HSSF), and data files later.
poi = "5.3.0"
# The bundled Python and SymPy (docs/symbolic.md#bundled-sympy): a python-build-standalone release.
python-standalone = "20261026"
python = "3.13.18"
sympy = "1.14.0"
mpmath = "1.3.0"

[libraries]
kotlinx-browser = { module = "org.jetbrains.kotlinx:kotlinx-browser", version.ref = "kotlinx-browser" }
snakeyaml-engine = { module = "org.snakeyaml:snakeyaml-engine", version.ref = "snakeyaml-engine" }
snakeyaml-engine-kmp = { module = "it.krzeminski:snakeyaml-engine-kmp", version.ref = "snakeyaml-engine-kmp" }
pdfbox = { module = "org.apache.pdfbox:pdfbox", version.ref = "pdfbox" }
poi = { module = "org.apache.poi:poi", version.ref = "poi" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose = { id = "org.jetbrains.compose", version.ref = "compose" }
